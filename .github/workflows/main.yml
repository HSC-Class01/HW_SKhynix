name: SK hynix DART Update and GitHub Pages

on:
  schedule:
    - cron: "20 0 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "update_data.py"
      - "normalize_quarters.py"
      - "agent.py"
      - "index.html"
      - "requirements.txt"
      - ".github/workflows/main.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sk-hynix-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and normalize DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_CORP_CODE: "00164779"
          START_YEAR: "2010"
        run: python agent.py
      - name: Commit updated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "chore: update SK hynix DART financial data"

          # The scheduled collector can overlap with a workflow triggered by a
          # source-code change. Rebase the generated data commit onto the
          # newest main while preferring the freshly collected data on conflict.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort || true
            sleep 5
          done

          echo "Failed to publish generated DART data after 3 attempts."
          exit 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
